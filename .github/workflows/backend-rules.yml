name: Backend rules and application checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  development-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/patch-firebase-auth.cjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dev-runtime
      - run: node scripts/verify-gift-access.mjs
      - run: node scripts/verify-mobile-ui.mjs
      - run: node scripts/verify-radar-research.mjs
      - run: node scripts/check-preview-restart.mjs
  bun-application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Exercise fresh Bun resolution without npm lockfile
        run: |
          mv package-lock.json "$RUNNER_TEMP/bsenexus-npm-lock.json"
          npx --yes bun@1.4.3 install --ignore-scripts
          node scripts/patch-firebase-auth.cjs
      - name: Bun-installed application build and type check
        run: npm run build --ignore-scripts
  rules-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:map
      - run: npm run map:check
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/patch-firebase-auth.cjs
      - name: Application type check
        run: npm run lint
      - name: Existing backend tests
        if: ${{ !cancelled() }}
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-not-a-production-secret-do-not-deploy
        run: npm test
      - name: Application build
        if: ${{ !cancelled() }}
        run: npm run build
