name: AI evidence investigation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ai-evidence:
    if: startsWith(github.head_ref, 'codex/ai-evidence')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-not-a-production-secret-do-not-deploy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/patch-firebase-auth.cjs
      - name: Trace consumers before source edits
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const raw=execFileSync('npm',['run','map:impact','--','server/ai/market.ts','server/ai/policy.ts','server/ai/tools.ts','server/ai/http.ts','server.ts','server/services/resultsCalendarService.ts'],{encoding:'utf8'});
          const r=JSON.parse(raw.slice(raw.indexOf('{')));
          console.log(JSON.stringify({consumers:r.importConsumers,domains:r.semanticDomains.map(d=>({id:d.id,viaFiles:d.viaFiles})),tests:r.candidateTests}));
          JS
      - name: Focused evidence regressions
        run: |
          node --test --import tsx server/tests/aiConnections.test.ts server/tests/aiConnectorQuality.test.ts server/tests/aiIngress.test.ts server/tests/aiPlugin.test.ts server/tests/calendarScope.test.ts
          if test -f server/tests/aiEvidence.test.ts; then
            node --test --import tsx server/tests/aiEvidence.test.ts
          fi
      - name: Install isolated browser for preview checks when added
        run: |
          if test -f scripts/verify-public-calendar.mjs; then
            npm view playwright@1.62.1 name version repository.url
            npm install --prefix "$RUNNER_TEMP/ai-evidence-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
            node "$RUNNER_TEMP/ai-evidence-browser/node_modules/playwright/cli.js" install chromium --with-deps
            PLAYWRIGHT_MODULE="$RUNNER_TEMP/ai-evidence-browser/node_modules/playwright/index.mjs" node --import tsx scripts/verify-public-calendar.mjs
          fi
      - name: Save synthetic preview screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: public-calendar-preview
          path: ${{ runner.temp }}/public-calendar-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Regenerate maps and record removal trace
        if: ${{ !cancelled() }}
        run: |
          git grep -nF -- 'ai-evidence-investigation.yml' || test "$?" -eq 1
          npm run map:generate
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const patch=execFileSync('git',['diff','--','rule/generated/spider-map.json','rule/generated/spider-map.html'],{encoding:'utf8',maxBuffer:20*1024*1024});
          const b64=Buffer.from(patch).toString('base64');
          for(let i=0;i<b64.length;i+=6000)console.log('MAP_PATCH_PART '+i+' '+b64.slice(i,i+6000));
          console.log('MAP_PATCH_LENGTH '+b64.length);
          JS
