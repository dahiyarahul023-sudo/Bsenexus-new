name: Connector quality investigation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  connector-quality:
    if: startsWith(github.head_ref, 'codex/connector-quality')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-not-a-production-secret-do-not-deploy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/patch-firebase-auth.cjs
      - name: Trace affected consumers before source edits
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const raw=execFileSync('npm',['run','map:impact','--','server/ai/policy.ts','server/ai/tools.ts','server/ai/market.ts','server/ai/http.ts','server/services/resultsCalendarService.ts','server/api/aiPlugin.ts'],{encoding:'utf8'});
          const r=JSON.parse(raw.slice(raw.indexOf('{')));
          console.log(JSON.stringify({consumers:r.importConsumers,domains:r.semanticDomains.map(d=>({id:d.id,viaFiles:d.viaFiles})),tests:r.candidateTests}));
          const {ImplementationSchema}=await import('@modelcontextprotocol/sdk/types.js');
          console.log('SDK_IDENTITY',JSON.stringify(ImplementationSchema.parse({name:'Bsenexus',version:'2.1.0',title:'BSE Nexus',websiteUrl:'https://bsenexus.in',icons:[{src:'https://bsenexus.in/icon-192.png',mimeType:'image/png',sizes:['192x192']}]})));
          JS
      - name: Focused connector tests
        run: |
          node --test --import tsx server/tests/aiConnections.test.ts server/tests/aiPlugin.test.ts
          if test -f server/tests/aiConnectorQuality.test.ts; then
            node --test --import tsx server/tests/aiConnectorQuality.test.ts
          fi
      - name: Regenerate maps and record removal trace
        if: ${{ !cancelled() }}
        run: |
          git grep -nF -- 'connector-quality-investigation.yml' || test "$?" -eq 1
          npm run map:generate
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const patch=execFileSync('git',['diff','--','rule/generated/spider-map.json','rule/generated/spider-map.html'],{encoding:'utf8',maxBuffer:20*1024*1024});
          const b64=Buffer.from(patch).toString('base64');
          for(let i=0;i<b64.length;i+=6000)console.log('MAP_PATCH_PART '+i+' '+b64.slice(i,i+6000));
          console.log('MAP_PATCH_LENGTH '+b64.length);
          JS
